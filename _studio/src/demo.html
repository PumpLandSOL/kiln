</style><body><div class="grain"></div><div class="glow" style="right:-500px;top:-500px"></div>
<div id="stage"></div><div id="cap"><span id="n"></span><span id="ct"></span></div><div id="prog"></div>
<div class="full" id="intro"><div><div style="display:flex;align-items:center;justify-content:center;gap:22px"><span class="kiln" style="width:84px;height:84px"></span><span class="h">KLIN</span></div><div class="sub">private compute, fired in a sealed oven</div></div></div>

<script>
const $=(i)=>document.getElementById(i),cl=(x)=>Math.max(0,Math.min(1,x)),e=(x)=>{x=cl(x);return x*x*(3-2*x)};
const p=new URLSearchParams(location.search);if(p.get('dom'))$('dom').textContent=p.get('dom');
const S=[[1.5,'01-home','Sealed models: live Chutes and Bittensor prices, prompts sealed in the browser',[1,.5,.5]],
[4.2,'02-home-2','Private mode runs a model on your own GPU over WebGPU. Nothing leaves',[1.3,.5,.5]],
[7,'03-network','The network: ask a lent GPU, pay per token in credits',[1.25,.4,.4]],
[9.8,'04-lend','Lend yours: plug your browser in, keep 70% of every answer',[1.3,.4,.45]],
[12.6,'05-messages','Sealed messages: X25519 + AES-GCM, the relay only sees bytes',[1.25,.4,.45]],
[15.4,'06-credits','Credits in USDG on Robinhood Chain, verified on-chain',[1.25,.4,.4]],[18.4]];
const END=18.4,DUR=20;
S.slice(0,-1).forEach((s,i)=>{const im=new Image();im.src='../shots/'+s[1]+'.png';im.id='i'+i;$('stage').appendChild(im);});
const tf=(z,p)=>{const s=1+(z[0]-1)*p;const fx=z[1]*1180,fy=z[2]*705;let x=590-fx*s,y=295-fy*s;x=Math.min(0,Math.max(1180-1180*s,x));y=Math.min(0,Math.max(590-705*s,y));return `translate(${x}px,${y}px) scale(${s})`;};
window.__seek=(t)=>{
  $('intro').style.opacity=1-e((t-1.1)/.4);$('outro').style.opacity=e((t-END)/.4);$('prog').style.width=(t/DUR*1280)+'px';
  let k=0;for(let i=0;i<S.length-1;i++)if(t>=S[i][0])k=i;
  S.slice(0,-1).forEach((s,i)=>{const im=$('i'+i);im.style.opacity=i<=k?e((t-s[0])/.35):0;im.style.zIndex=i;const len=S[i+1][0]-s[0];im.style.transform=tf(s[3],e((t-s[0]-.15)/(len*.55)));});
  $('n').textContent=String(k+1).padStart(2,'0')+' / 06';$('ct').textContent=S[k][2];$('cap').style.opacity=e((t-S[k][0])/.3)*(t<END?1:0);
};window.__ready=Promise.all([...document.images].map((i)=>i.decode().catch(()=>0)));window.__seek(0);
</script>
